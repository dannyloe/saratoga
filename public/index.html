<style>

  /* ---- marquee top bar ---- */

  }
  .topbar-inner {
    max-width: 920px; margin: 0 auto; padding: 18px 20px 14px;

  .wordmark {

  }
  .wordmark h1 {

  }
  .wordmark .dates { color: var(--muted); font-size: 0.85rem; }
  nav.tabs {
    margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .tab-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tab-divider { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .pill-btn {
    border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink-text);
    border-radius: 999px; padding: 6px 13px; font-size: 0.82rem; font-weight: 500;
    transition: border-color 0.15s, color 0.15s, background 0.15s;

  .pill-btn:hover { border-color: var(--brass); color: var(--brass-strong); }

  main { max-width: 920px; margin: 0 auto; padding: 28px 20px 80px; }

  /* ---- master / day sections ---- */

  .day-heading {

  .event-time { color: var(--muted); font-size: 0.82rem; padding-top: 2px; }

  .event-loc { color: var(--muted); font-size: 0.87rem; margin-bottom: 6px; }
  .event-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
  .status-pill {
    border-radius: 999px; font-size: 0.7rem; font-weight: 600; padding: 2px 9px;

  .status-pill.paid { background: var(--paid-bg); color: var(--paid-fg); }
  .status-pill.unpaid { background: var(--unpaid-bg); color: var(--unpaid-fg); }
  .status-pill.hidden { background: var(--hidden-bg); color: var(--hidden-fg); }
  .status-pill.pending { background: var(--pending-bg); color: var(--pending-fg); }
  .conf-num { color: var(--muted); font-size: 0.78rem; }
  .who-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .who-chip {

    font-size: 0.74rem; padding: 2px 9px; color: var(--ink-text);

  .who-chip:hover { border-color: var(--brass); color: var(--brass-strong); }
  .event-notes { color: var(--muted); font-size: 0.83rem; font-style: italic; line-height: 1.5; }
  .room-tag { color: var(--muted); font-size: 0.83rem; }

  /* ---- person view ---- */
  .person-header { margin-bottom: 8px; }
  .person-header h2 { font-size: 2rem; margin: 0; font-weight: 600; }
  .person-header .household { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }
  .back-link {
    display: inline-block; margin-bottom: 18px; font-size: 0.85rem; color: var(--muted);
    border: none; background: none; padding: 0; text-decoration: underline;
  }
  .back-link:hover { color: var(--brass-strong); }

  .p-day { margin: 26px 0 6px; font-weight: 600; font-size: 1.05rem;
    display: flex; align-items: baseline; gap: 10px; }
  .p-day .datestr { color: var(--muted); font-weight: 400; font-size: 0.85rem; }
  .p-row {
    display: grid; grid-template-columns: 118px 1fr; gap: 14px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .p-row:last-child { border-bottom: none; }
  .p-label { font-weight: 600; color: var(--brass-strong); font-size: 0.88rem; padding-top: 1px; }
  .p-detail .p-time { color: var(--muted); font-size: 0.8rem; margin-bottom: 2px; }
  .p-detail .p-title { font-weight: 600; margin-bottom: 2px; }
  .p-detail .p-loc { color: var(--muted); font-size: 0.87rem; margin-bottom: 4px; }
  .p-detail .p-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; }
  .p-detail .p-notes { color: var(--muted); font-size: 0.82rem; font-style: italic; line-height: 1.5; }
  .p-detail .p-together { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }

  /* ---- open items ---- */
  .oi-group { margin-bottom: 24px; }

  .modal-box {

  .modal-sub { color: var(--muted); font-size: 0.82rem; margin: 0 0 16px; }
  .modal-field { margin-bottom: 13px; }

    display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted);

  .modal-field input, .modal-field select, .modal-field textarea {
    width: 100%; border: 1px solid var(--line); background: var(--paper); color: var(--ink-text);

  .modal-field textarea { resize: vertical; min-height: 60px; }
  .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; }
  .modal-save {

    border-radius: 999px; padding: 8px 18px; font-weight: 600; font-size: 0.88rem;

  .modal-save:hover { background: var(--brass); }
  .modal-save:disabled { opacity: 0.6; cursor: default; }
  .modal-cancel { background: none; border: none; color: var(--muted); font-size: 0.85rem; text-decoration: underline; }
  .modal-status { font-size: 0.8rem; color: var(--muted); margin-top: 10px; min-height: 1.2em; }

  .who-edit-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }

  .who-edit-chip button:hover { background: var(--line); color: var(--ink-text); }
  .who-add-row { display: flex; gap: 6px; }
  .who-add-row input { flex: 1; }
  .who-add-row button {
    border: 1px solid var(--line); background: var(--paper); color: var(--ink-text);
    border-radius: 6px; padding: 6px 14px; font-size: 0.85rem; font-weight: 600;
  }
  .who-add-row button:hover { border-color: var(--brass); color: var(--brass-strong); }

  .modal-dates-grid { display: flex; flex-wrap: wrap; gap: 8px; }

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('trip-data').textContent);
  const byDate = {};
  DATA.days.forEach(d => byDate[d.date] = d);

  function fmtWho(codes) {
    return codes.map(c => {
      if (c === 'Megan') return 'Megan Mikulencak';
      const p = DATA.people.find(pp => pp.code === c);
      return p ? p.name : c;
    });
  }

  function personFirst(code) {
    if (code === 'Megan') return 'Megan';
    const p = DATA.people.find(pp => pp.code === code);
    return p ? p.name.split(' ')[0] : code;
  }

  // ---------- top nav ----------
  const tabs = document.getElementById('tabs');
  const households = {};
  DATA.people.forEach(p => { (households[p.household] = households[p.household] || []).push(p); });

  const pendingCount = DATA.events.filter(e => (e.confFlag && e.confFlag.kind === 'pending') ||
    (e.payPill && (e.payPill.kind === 'pending' || e.payPill.kind === 'unpaid'))).length;

  function pill(label, onClick, extraClass, badge) {
    const b = document.createElement('button');
    b.className = 'pill-btn' + (extraClass ? ' ' + extraClass : '');
    b.textContent = label;
    if (badge) {
      const sp = document.createElement('span');
      sp.className = 'badge';
      sp.textContent = badge;
      b.appendChild(sp);
    }
    b.addEventListener('click', onClick);
    return b;
  }

  const groupMaster = document.createElement('div');
  groupMaster.className = 'tab-group';
  groupMaster.appendChild(pill('Overview', () => showMaster(), 'master-btn'));
  tabs.appendChild(groupMaster);

  const div1 = document.createElement('div');
  div1.className = 'tab-divider';
  tabs.appendChild(div1);

  Object.keys(households).forEach((hh, i) => {
    const g = document.createElement('div');
    g.className = 'tab-group';
    households[hh].forEach(p => {
      g.appendChild(pill(p.name.split(' ')[0], () => showPerson(p.code), 'person person-btn', null));
    });
    tabs.appendChild(g);
    if (i < Object.keys(households).length - 1) {
      const d = document.createElement('div');
      d.className = 'tab-divider';
      tabs.appendChild(d);
    }
  });

  const div2 = document.createElement('div');
  div2.className = 'tab-divider';
  tabs.appendChild(div2);
  const openBtn = pill('Open Items', () => showOpen(), 'open-btn', pendingCount ? String(pendingCount) : null);
  tabs.appendChild(openBtn);
  const logBtn = pill('Update Log', () => showLog(), 'log-btn', null);
  tabs.appendChild(logBtn);

  function updateLogBadge(count) {
    let sp = logBtn.querySelector('.badge');
    if (!count) { if (sp) sp.remove(); return; }
    if (!sp) { sp = document.createElement('span'); sp.className = 'badge'; logBtn.appendChild(sp); }
    sp.textContent = String(count);
  }

  function updateOpenBadge(count) {
    let sp = openBtn.querySelector('.badge');
    if (!count) { if (sp) sp.remove(); return; }
    if (!sp) { sp = document.createElement('span'); sp.className = 'badge'; openBtn.appendChild(sp); }
    sp.textContent = String(count);
  }

  function setActive(btnPredicate) {
    tabs.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
  }

  // ---------- master view ----------
  const viewMaster = document.getElementById('view-master');
  const viewPerson = document.getElementById('view-person');
  const viewOpen = document.getElementById('view-open');

  function statusPillHtml(pillObj) {
    if (!pillObj) return '';
    return `<span class="status-pill ${pillObj.kind}">${pillObj.label}</span>`;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Converts an event's time string into a sortable minutes-since-midnight
  // value so the day view stays chronological even after edits. Handles
  // plain times ("6:30 PM"), dual tee times ("1:20 & 1:30 PM" \u2014 sorts by
  // the earlier one), prefixed times ("Check-in 3:00 PM"), and the
  // non-time labels used elsewhere in the data ("Night", "TBD", "AM",
  // multi-night stay spans like "4 nights").
  function parseTimeForSort(t) {
    if (!t) return 24 * 60 + 2;
    const s = String(t).trim();
    if (/^night$/i.test(s)) return 23 * 60;
    if (/^tbd$/i.test(s)) return 24 * 60 + 1;
    if (/^am$/i.test(s)) return 8 * 60;
    if (/^\d+\s*nights?$/i.test(s)) return -1;
    const m = s.match(/(\d{1,2}):(\d{2})(?:\s*&\s*\d{1,2}:\d{2})?\s*(AM|PM)/i);
    if (m) {
      let h = parseInt(m[1], 10) % 12;
      if (/pm/i.test(m[3])) h += 12;
      return h * 60 + parseInt(m[2], 10);
    }
    return 24 * 60; // unrecognized text \u2014 near the end, before TBD
  }

  function sortByTime(list) {
    return list.slice().sort((a, b) => parseTimeForSort(a.time) - parseTimeForSort(b.time));
  }

  function lastEditedHtml(ev) {
    if (!ev.lastEdited) return '';
    const by = ev.lastEdited.by ? escapeHtml(ev.lastEdited.by) : 'someone';
    return `<div class="last-edited">Last updated by ${by}</div>`;
  }

  function eventCardHtml(ev, opts) {
    opts = opts || {};
    const who = opts.hideWho ? '' : `<div class="who-chips">${ev.who.map(c => `<button class="who-chip" data-goto="${c}">${personFirst(c)}</button>`).join('')}</div>`;

    const conf = ev.conf ? `<span class="conf-num mono">#${escapeHtml(ev.conf)}</span>` : (ev.confFlag ? `<span class="status-pill ${ev.confFlag.kind}">${escapeHtml(ev.confFlag.label)}</span>` : '');
    return `
      <div class="event-card">
        <div>
          <div class="event-time mono">${escapeHtml(ev.time)}</div>
          <div class="event-cat">${escapeHtml(ev.category)}</div>
        </div>
        <div>
          <p class="event-title">${escapeHtml(ev.title)}</p>
          <p class="event-loc">${escapeHtml(ev.location)}${ev.room ? ' &middot; ' + escapeHtml(ev.room) : ''}</p>
          ${who}
          <div class="event-meta">${statusPillHtml(ev.payPill)}${conf}</div>
          ${ev.notes ? `<p class="event-notes">${escapeHtml(ev.notes)}</p>` : ''}
          ${lastEditedHtml(ev)}
          <button class="edit-btn" data-edit="${ev.id}">&#9998; Edit</button>
        </div>
      </div>`;
  }

  function renderMaster() {
    let html = `<button class="add-event-btn" id="add-event-btn">+ Add a new event</button>`;
    DATA.days.forEach(day => {
      const evs = sortByTime(DATA.events.filter(e => e.dates.includes(day.date)));
      if (!evs.length) return;
      html += `<div class="day-block"><div class="day-heading"><span class="weekday">${day.weekday}</span><span class="datestr mono">${day.label}, 2026</span></div>`;
      evs.forEach(ev => { html += eventCardHtml(ev); });
      html += `</div>`;
    });
    viewMaster.innerHTML = html;
    viewMaster.querySelectorAll('[data-goto]').forEach(el => {
      el.addEventListener('click', () => showPerson(el.getAttribute('data-goto')));
    });
    viewMaster.querySelectorAll('[data-edit]').forEach(el => {
      el.addEventListener('click', () => openEditModal(Number(el.getAttribute('data-edit'))));
    });
    document.getElementById('add-event-btn').addEventListener('click', openNewEventModal);
  }

  // ---------- person view ----------
  function renderPerson(code) {
    const person = DATA.people.find(p => p.code === code) || { name: code, household: '' };
    const evs = DATA.events.filter(e => e.who.includes(code));
    let html = `<div class="person-header"><button class="back-link" id="back-to-master">&larr; Overview</button>
      <h2>${person.name}</h2><div class="household">${person.household ? person.household + ' household' : ''}</div></div>`;

    DATA.days.forEach(day => {
      const dayEvs = sortByTime(evs.filter(e => e.dates.includes(day.date)));
      if (!dayEvs.length) return;
      html += `<div class="p-day">${day.weekday}<span class="datestr mono">${day.label}, 2026</span></div>`;
      dayEvs.forEach(ev => {
        const others = ev.who.filter(c => c !== code).map(personFirst);
        const conf = ev.conf ? `<span class="conf-num mono">#${escapeHtml(ev.conf)}</span>` : (ev.confFlag ? `<span class="status-pill ${ev.confFlag.kind}">${escapeHtml(ev.confFlag.label)}</span>` : '');
        html += `<div class="p-row">
          <div class="p-label">${escapeHtml(ev.category)}</div>
          <div class="p-detail">
            <div class="p-time mono">${escapeHtml(ev.time)}</div>
            <div class="p-title">${escapeHtml(ev.title)}</div>
            <div class="p-loc">${escapeHtml(ev.location)}${ev.room ? ' &middot; ' + escapeHtml(ev.room) : ''}</div>
            <div class="p-meta">${statusPillHtml(ev.payPill)}${conf}</div>
            ${ev.notes ? `<div class="p-notes">${escapeHtml(ev.notes)}</div>` : ''}
            ${others.length ? `<div class="p-together">With ${others.join(', ')}</div>` : ''}
            ${lastEditedHtml(ev)}
            <button class="edit-btn" data-edit="${ev.id}">&#9998; Edit</button>
          </div>
        </div>`;
      });
    });
    viewPerson.innerHTML = html;
    document.getElementById('back-to-master').addEventListener('click', showMaster);
    viewPerson.querySelectorAll('[data-edit]').forEach(el => {
      el.addEventListener('click', () => openEditModal(Number(el.getAttribute('data-edit'))));
    });
  }

  // ---------- open items view ----------
  function renderOpen() {
    const items = DATA.events.filter(e => (e.confFlag && e.confFlag.kind === 'pending') ||
      (e.payPill && (e.payPill.kind === 'pending' || e.payPill.kind === 'unpaid')));
    const byCat = {};
    items.forEach(e => { (byCat[e.category] = byCat[e.category] || []).push(e); });
    let html = `<h2 class="display" style="margin-top:0;">Open items</h2><p style="color:var(--muted); margin-top:-6px;">Everything still missing a confirmation number or payment, grouped by type.</p>`;
    Object.keys(byCat).forEach(cat => {
      html += `<div class="oi-group"><h3>${cat}</h3>`;
      byCat[cat].forEach(ev => {
        const whyPills = `${statusPillHtml(ev.payPill)}${ev.confFlag ? `<span class="status-pill ${ev.confFlag.kind}">${escapeHtml(ev.confFlag.label)}</span>` : ''}`;
        html += `<div class="oi-item">
          <div class="oi-title">${escapeHtml(ev.title)}</div>
          <div class="oi-who">${fmtWho(ev.who).join(', ')}</div>
          <div class="event-meta" style="margin: 4px 0;">${whyPills}</div>
          <div class="oi-notes">${escapeHtml(ev.notes || '')}</div>
          ${lastEditedHtml(ev)}
          <button class="edit-btn" data-edit="${ev.id}">&#9998; Add details</button>
        </div>`;
      });
      html += `</div>`;
    });
    html += `<div class="oi-group"><h3>Flagged for awareness</h3>
      <div class="oi-flag">JR's Monday-night golf-trip lodging is his own arrangement, separate from the group's Tarrytown House Estate booking &mdash; not tracked here.</div>
      <div class="oi-flag">JR's Tuesday-night Manhattan lodging (traveling with his father) is his own arrangement and isn't tracked here.</div>
      <div class="oi-flag">JR's Wednesday-night hotel after Metropolis is TBD and his own arrangement &mdash; he does not fly home Thursday with the group.</div>
      <div class="oi-flag">Cole &amp; Neely's two Martinique rooms (confirmations 3521495361 and 3515627522) still only list Danny Loe as the named guest on the Hilton record &mdash; add their names at check-in.</div>
    </div>`;
    viewOpen.innerHTML = html;
    viewOpen.querySelectorAll('[data-edit]').forEach(el => {
      el.addEventListener('click', () => openEditModal(Number(el.getAttribute('data-edit'))));
    });
  }

  function showMaster() {
    viewMaster.classList.add('active'); viewPerson.classList.remove('active'); viewOpen.classList.remove('active');
    setActive();
    document.querySelector('.master-btn').classList.add('active');
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  function showPerson(code) {
    renderPerson(code);
    viewPerson.classList.add('active'); viewMaster.classList.remove('active'); viewOpen.classList.remove('active');
    setActive();
    tabs.querySelectorAll('.person-btn').forEach(b => { if (b.textContent === personFirst(code)) b.classList.add('active'); });
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  function showOpen() {
    renderOpen();
    viewOpen.classList.add('active'); viewMaster.classList.remove('active'); viewPerson.classList.remove('active');
    setActive();
    document.querySelector('.open-btn').classList.add('active');
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  const viewLog = document.getElementById('view-log');
  function showLog() {
    renderLog();
    viewLog.classList.add('active'); viewMaster.classList.remove('active'); viewPerson.classList.remove('active'); viewOpen.classList.remove('active');
    setActive();
    document.querySelector('.log-btn').classList.add('active');
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  // ---------- shared storage: group edits ----------
  const STORAGE_KEY = 'overrides';
  const NEW_EVENTS_KEY = 'new-events';
  let overrides = {};       // { eventId: {time, location, room, conf, payStatus, notes, who, lastEdited} }
  let newEvents = [];       // [ full event objects added by the group ]
  let currentView = 'master';
  let currentPersonCode = null;
  const syncNote = document.getElementById('sync-note');

  async function loadOverrides() {
    try {
      const res = await fetch('/api/overrides');
      overrides = res.ok ? await res.json() : {};
    } catch (err) {
      overrides = {};
    }
  }

  async function loadNewEvents() {
    try {
      const res = await fetch('/api/new-events');
      newEvents = res.ok ? await res.json() : [];
    } catch (err) {
      newEvents = [];
    }
  }

  async function saveNewEvents(latest) {
    await fetch('/api/new-events', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(latest)
    });
  }

  function payKindToLabel(kind) {
    return { paid: 'Paid', unpaid: 'Unpaid', pending: 'Pending', hidden: 'Hidden' }[kind] || '';
  }

  function applyOverrides() {
    // Merge in any brand-new events the group has added, once.
    newEvents.forEach(ne => {
      if (!DATA.events.some(e => e.id === ne.id)) DATA.events.push(ne);
    });
    DATA.events.forEach(ev => {
      const o = overrides[ev.id];
      if (!o) return;
      if (o.time) ev.time = o.time;
      if (o.location) ev.location = o.location;
      if (o.room) ev.room = o.room;
      if (o.conf) { ev.conf = o.conf; ev.confFlag = null; }
      if (o.notes) ev.notes = o.notes;
      if (o.who) ev.who = o.who;
      if (o.payStatus) {
        ev.payPill = { label: payKindToLabel(o.payStatus), kind: o.payStatus };
      }
      if (o.lastEdited) ev.lastEdited = o.lastEdited;
    });
  }

  function recomputeBadgeAndNote() {
    const count = DATA.events.filter(e => (e.confFlag && e.confFlag.kind === 'pending') ||
      (e.payPill && (e.payPill.kind === 'pending' || e.payPill.kind === 'unpaid'))).length;
    updateOpenBadge(count);
    const n = Object.keys(overrides).length + newEvents.length;
    syncNote.textContent = n
      ? `Synced with the group \u2014 ${n} update${n === 1 ? '' : 's'} made by the group so far.`
      : 'Synced with the group \u2014 no updates yet. Tap "Edit" on any item to add details.';
    const newCount = Object.values(overrides).filter(o => o.lastEdited && o.lastEdited.at &&
      (!lastExportAt || o.lastEdited.at > lastExportAt)).length;
    updateLogBadge(newCount);
  }

  function reRenderCurrentView() {
    if (currentView === 'master') { renderMaster(); }
    else if (currentView === 'person') { renderPerson(currentPersonCode); }
    else if (currentView === 'open') { renderOpen(); }
    else if (currentView === 'log') { renderLog(); }
    recomputeBadgeAndNote();
  }

  // wrap show* to track current view
  const _showMaster = showMaster, _showPerson = showPerson, _showOpen = showOpen, _showLog = showLog;
  showMaster = function () { currentView = 'master'; _showMaster(); };
  showPerson = function (code) { currentView = 'person'; currentPersonCode = code; _showPerson(code); };
  showOpen = function () { currentView = 'open'; _showOpen(); };
  showLog = function () { currentView = 'log'; _showLog(); };

  // ---------- edit modal ----------

  const mTime = document.getElementById('f-time');

  const mRoom = document.getElementById('f-room');

  const mPay = document.getElementById('f-pay');
  const mNotes = document.getElementById('f-notes');
  const mName = document.getElementById('f-name');
  const mSave = document.getElementById('modal-save');
  const mCancel = document.getElementById('modal-cancel');
  const mStatus = document.getElementById('modal-status');
  let editingId = null;
  let isNewEvent = false;
  let currentWhoList = [];

  function renderWhoChips() {
    mWhoChips.innerHTML = currentWhoList.map((code, i) => {
      const label = escapeHtml(fmtWho([code])[0]);
      return `<span class="who-edit-chip">${label}<button type="button" data-remove-who="${i}">&times;</button></span>`;
    }).join('') || '<span style="color:var(--muted); font-size:0.82rem;">Nobody added yet</span>';
    mWhoChips.querySelectorAll('[data-remove-who]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentWhoList.splice(Number(btn.getAttribute('data-remove-who')), 1);
        renderWhoChips();
      });
    });
  }

  function addWhoFromInput() {
    const name = mWhoAdd.value.trim();
    if (!name) return;
    // Match an existing traveler by code or first name so their full name displays correctly.
    const match = DATA.people.find(p => p.code.toLowerCase() === name.toLowerCase() ||
      p.name.split(' ')[0].toLowerCase() === name.toLowerCase());
    const code = match ? match.code : name;
    if (!currentWhoList.includes(code)) currentWhoList.push(code);
    mWhoAdd.value = '';
    renderWhoChips();
  }
  mWhoAddBtn.addEventListener('click', addWhoFromInput);
  mWhoAdd.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addWhoFromInput(); } });

  function openEditModal(id) {
    const ev = DATA.events.find(e => e.id === id);
    if (!ev) return;
    editingId = id;
    isNewEvent = false;
    mTitleField.style.display = 'none';
    mCategoryField.style.display = 'none';
    mDatesField.style.display = 'none';
    mTitle.textContent = ev.title;
    mSub.textContent = fmtWho(ev.who).join(', ');
    currentWhoList = ev.who.slice();
    renderWhoChips();
    mTime.value = ev.time === 'TBD' ? '' : (ev.time || '');
    mLoc.value = ev.location || '';
    mRoom.value = ev.room || '';
    mConf.value = ev.conf || '';
    mPay.value = ev.payPill ? ev.payPill.kind : '';
    mNotes.value = ev.notes || '';
    mName.value = (ev.lastEdited && ev.lastEdited.by) || '';
    mStatus.textContent = '';
    mSave.disabled = false;
    mSave.textContent = 'Save update';
    overlay.classList.add('open');
  }

  function openNewEventModal() {
    editingId = null;
    isNewEvent = true;
    mTitleField.style.display = '';
    mCategoryField.style.display = '';
    mDatesField.style.display = '';
    mTitle.textContent = 'Add a new event';
    mSub.textContent = 'Anyone with this link can add and edit events.';
    mTitleInput.value = '';
    mCategoryInput.value = 'Dine';
    mDatesChecks.innerHTML = DATA.days.map(d =>
      `<label class="modal-date-check"><input type="checkbox" value="${d.date}"> ${d.weekday} ${d.label}</label>`
    ).join('');
    currentWhoList = [];
    renderWhoChips();
    mTime.value = '';
    mLoc.value = '';
    mRoom.value = '';
    mConf.value = '';
    mPay.value = '';
    mNotes.value = '';
    mName.value = '';
    mStatus.textContent = '';
    mSave.disabled = false;
    mSave.textContent = 'Add event';
    overlay.classList.add('open');
  }

  function closeModal() {
    overlay.classList.remove('open');
    editingId = null;
    isNewEvent = false;
  }

  mCancel.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  mSave.addEventListener('click', async () => {
    if (editingId == null && !isNewEvent) return;
    const editorName = mName.value.trim() || 'a group member';
    mSave.disabled = true;
    mStatus.textContent = '';

    if (isNewEvent) {
      const selectedDates = Array.from(mDatesChecks.querySelectorAll('input:checked')).map(el => el.value);
      const title = mTitleInput.value.trim();
      if (!title || !selectedDates.length) {
        mSave.disabled = false;
        mStatus.textContent = 'Please add a title and pick at least one date.';
        return;
      }
      mSave.textContent = 'Adding\u2026';
      const conf = mConf.value.trim();
      const newEv = {
        id: Date.now(),
        dates: selectedDates,
        time: mTime.value.trim() || 'TBD',
        category: mCategoryInput.value,
        title: title,
        location: mLoc.value.trim(),
        room: mRoom.value.trim() || null,
        who: currentWhoList.slice(),
        whoNames: currentWhoList.slice(),
        conf: conf || null,
        confFlag: conf ? null : { label: 'Needs confirmation #', kind: 'pending' },
        prepaid: null,
        payStatus: mPay.value ? payKindToLabel(mPay.value) : null,
        payPill: mPay.value ? { label: payKindToLabel(mPay.value), kind: mPay.value } : null,
        notes: mNotes.value.trim(),
        lastEdited: { by: editorName, at: new Date().toISOString() }
      };
      try {
        newEvents.push(newEv);
        await saveNewEvents(newEvents);
        applyOverrides();
        closeModal();
        reRenderCurrentView();
      } catch (err) {
        newEvents.pop();
        mSave.disabled = false;
        mSave.textContent = 'Add event';
        mStatus.textContent = "Couldn't save \u2014 check your connection and try again.";
      }
      return;
    }

    const patch = {
      time: mTime.value.trim(),
      location: mLoc.value.trim(),
      room: mRoom.value.trim(),
      conf: mConf.value.trim(),
      payStatus: mPay.value,
      notes: mNotes.value.trim(),
      who: currentWhoList.slice(),
      lastEdited: { by: editorName, at: new Date().toISOString() }
    };
    mSave.textContent = 'Saving\u2026';
    try {
      const merged = Object.assign({}, overrides[editingId] || {}, patch);
      const res = await fetch('/api/overrides/' + editingId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(merged)
      });
      if (!res.ok) throw new Error('Save failed');
      overrides[editingId] = await res.json();
      applyOverrides();
      closeModal();
      reRenderCurrentView();
    } catch (err) {
      mSave.disabled = false;
      mSave.textContent = 'Save update';
      mStatus.textContent = "Couldn't save \u2014 check your connection and try again.";
    }
  });

  // ---------- update log ----------
  const LOG_EXPORT_KEY = 'log-last-export';
  let lastExportAt = null; // ISO string or null

  async function loadLastExportAt() {
    try {
      const res = await fetch('/api/meta/log-last-export');
      const result = res.ok ? await res.json() : null;
      lastExportAt = result && result.value ? result.value : null;
    } catch (err) {
      lastExportAt = null;
    }
  }

  function fieldLine(label, val) {
    return val ? `${label}: ${val}` : '';
  }

  function entryFieldsText(o) {
    const parts = [
      fieldLine('Time', o.time),
      fieldLine('Location/details', o.location),
      fieldLine('Room/vehicle', o.room),
      fieldLine('Confirmation #', o.conf),
      fieldLine('Payment status', o.payStatus ? payKindToLabel(o.payStatus) : ''),
      fieldLine('Notes', o.notes),
    ].filter(Boolean);
    return parts.join('; ');
  }

  function getLogEntries() {
    const fromOverrides = Object.keys(overrides).map(id => {
      const ev = DATA.events.find(e => e.id === Number(id));
      const o = overrides[id];
      return {
        id: Number(id),
        title: ev ? ev.title : `Event #${id}`,
        who: ev ? fmtWho(ev.who).join(', ') : '',
        fieldsText: entryFieldsText(o),
        by: (o.lastEdited && o.lastEdited.by) || 'a group member',
        at: (o.lastEdited && o.lastEdited.at) || null,
      };
    });
    const fromNewEvents = newEvents.map(ne => ({
      id: ne.id,
      title: ne.title + ' (new event)',
      who: fmtWho(ne.who).join(', '),
      fieldsText: entryFieldsText({ time: ne.time, location: ne.location, room: ne.room, conf: ne.conf, notes: ne.notes }),
      by: (ne.lastEdited && ne.lastEdited.by) || 'a group member',
      at: (ne.lastEdited && ne.lastEdited.at) || null,
    }));
    return fromOverrides.concat(fromNewEvents).sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  }

  function fmtWhen(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    } catch (e) { return iso; }
  }

  function entriesToText(entries) {
    if (!entries.length) return 'No updates to report.';
    const lines = ['Loe Group Trip \u2014 update log', ''];
    entries.forEach(e => {
      lines.push(`\u2022 ${e.title} (${e.who})`);
      if (e.fieldsText) lines.push(`  ${e.fieldsText}`);
      lines.push(`  \u2014 updated by ${e.by}${e.at ? ' on ' + fmtWhen(e.at) : ''}`);
      lines.push('');
    });
    return lines.join('\n').trim();
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (err) {
      return false;
    }
  }

  function renderLog() {
    const allEntries = getLogEntries();
    const newEntries = lastExportAt ? allEntries.filter(e => e.at && e.at > lastExportAt) : allEntries;

    let html = `<h2 class="display" style="margin-top:0;">Update log</h2>
      <p style="color:var(--muted); margin-top:-6px;">Every detail the group has added, newest first. Copy and paste this back to Claude to fold into the master data.</p>
      <div class="log-actions">
        <button class="log-btn-action" id="log-copy-new">Copy new updates (${newEntries.length})</button>
        <button class="log-btn-action secondary" id="log-copy-all">Copy all updates (${allEntries.length})</button>
      </div>
      <p class="log-status" id="log-status">${lastExportAt ? 'Last copied ' + fmtWhen(lastExportAt) + '.' : 'Nothing copied back to Claude yet.'}</p>
      <textarea class="log-textarea" id="log-text" readonly>${escapeHtml(entriesToText(newEntries))}</textarea>`;

    if (!allEntries.length) {
      html += `<p class="log-empty">No edits yet \u2014 once someone taps Edit on an item, it'll show up here.</p>`;
    } else {
      allEntries.forEach(e => {
        html += `<div class="log-entry">
          <div class="log-when">${fmtWhen(e.at)}${lastExportAt && e.at && e.at <= lastExportAt ? ' \u00b7 already copied' : ''}</div>
          <div class="log-title">${escapeHtml(e.title)} <span style="font-weight:400;color:var(--muted);">(${escapeHtml(e.who)})</span></div>
          <div class="log-fields">${escapeHtml(e.fieldsText || 'No fields filled in yet.')}</div>
          <div class="last-edited">Updated by ${escapeHtml(e.by)}</div>
        </div>`;
      });
    }

    viewLog.innerHTML = html;

    const logText = document.getElementById('log-text');
    const logStatus = document.getElementById('log-status');

    document.getElementById('log-copy-new').addEventListener('click', async () => {
      const text = entriesToText(newEntries);
      logText.value = text;
      logText.select();
      const ok = await copyText(text);
      logStatus.textContent = ok
        ? 'Copied to your clipboard \u2014 paste it back to Claude.'
        : 'Selected below \u2014 press Ctrl/Cmd+C to copy, then paste it back to Claude.';
      if (newEntries.length) {
        const now = new Date().toISOString();
        try {
          await fetch('/api/meta/log-last-export', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ value: now })
          });
          lastExportAt = now;
        } catch (err) { /* non-fatal */ }
      }
      recomputeBadgeAndNote();
    });

    document.getElementById('log-copy-all').addEventListener('click', async () => {
      const text = entriesToText(allEntries);
      logText.value = text;
      logText.select();
      const ok = await copyText(text);
      logStatus.textContent = ok
        ? 'Copied everything to your clipboard \u2014 paste it back to Claude.'
        : 'Selected below \u2014 press Ctrl/Cmd+C to copy, then paste it back to Claude.';
    });
  }

  // ---------- init ----------
  (async function init() {
    syncNote.textContent = 'Loading shared updates\u2026';
    await loadOverrides();
    await loadNewEvents();
    await loadLastExportAt();
    applyOverrides();
    renderMaster();
    showMaster();
    recomputeBadgeAndNote();
  })();
})();
</script>
